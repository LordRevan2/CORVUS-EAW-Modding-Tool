<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft cyan glow matching shadow-[0_0_15px_rgba(6,182,212,0.5)] -->
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.55" />
      <stop offset="80%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer soft cyan aura -->
  <rect x="8" y="8" width="496" height="496" rx="72" fill="url(#cyanGlow)" />

  <!-- Main Cyan Square (bg-cyan-500 rounded-sm) -->
  <rect x="56" y="56" width="400" height="400" rx="36" fill="#06b6d4" />

  <!-- Inner 45-degree Rotated Square (w-5 h-5 border-2 border-slate-950 rotate-45) -->
  <rect
    x="146"
    y="146"
    width="220"
    height="220"
    rx="4"
    fill="none"
    stroke="#020617"
    stroke-width="26"
    stroke-linejoin="round"
    transform="rotate(45 256 256)"
  />
</svg>
